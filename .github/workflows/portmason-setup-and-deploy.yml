name: setup-maintain-deploy-via-portmason

on:
  workflow_dispatch:
    inputs:
      collection_date:
        description: "Optional publication collection date (YYYY-MM-DD). Leave blank for today in each collection timezone."
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: portmason-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      PROJECT_DIR: site
      DEPLOY_DIR: site/deploy/prd
      PAGES_SITE_DIR: site/www
      OPS_DIR: ops-and-sops
      ETALSOLUTIONSLLC_OPS_AND_SOPS_READ_TOKEN: ${{ secrets.ETALSOLUTIONSLLC_OPS_AND_SOPS_READ_TOKEN }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 0

      - name: Install Portmason tooling
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${ETALSOLUTIONSLLC_OPS_AND_SOPS_READ_TOKEN}" ]] || {
            echo "::error::ETALSOLUTIONSLLC_OPS_AND_SOPS_READ_TOKEN is required to read private EtalSolutionsLLC/ops-and-sops"
            exit 1
          }

          mkdir $OPS_DIR
          export GITHUB_TOKEN="${ETALSOLUTIONSLLC_OPS_AND_SOPS_READ_TOKEN}"

          git clone --filter=blob:none --sparse https://x-access-token:${GITHUB_TOKEN}@github.com/EtalSolutionsLLC/ops-and-sops.git $OPS_DIR
          cd $OPS_DIR
          git sparse-checkout set ops/portmason

          portmason_share="${GITHUB_WORKSPACE}/${OPS_DIR}/ops/portmason"

          [[ -d "${portmason_share}" ]] || {
            echo "::error::Portmason directory is missing: ${portmason_share}"
            exit 1
          }

          [[ -x "${portmason_share}/pm-setup" ]] || {
            echo "::error::pm-setup is missing or not executable"
            exit 1
          }

          printf 'PORTMASON_SHARE=%s\n' "${portmason_share}" >> "${GITHUB_ENV}"
          printf '%s\n' "${portmason_share}" >> "${GITHUB_PATH}"

      - name: Install SOPS
        shell: bash
        run: |
          set -euo pipefail
          sops_binary="${RUNNER_TEMP}/sops-v3.13.3.linux.amd64"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64' \
            --output "${sops_binary}"
          printf '%s  %s\n' \
            'e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b' \
            "${sops_binary}" | sha256sum --check --status
          sudo install -m 0755 "${sops_binary}" /usr/local/bin/sops

      - name: Run Portmason setup
        working-directory: ${{ env.DEPLOY_DIR }}
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITHUB_ACTIONS: "true"
          PM_NO_REDIRECT: "1"
          PM_OFFICIAL_BUILD: "true"
          PM_SOURCE_COMMIT: ${{ github.sha }}
          PM_SOURCE_DIRTY: "false"
          PM_DEPLOYMENT_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          PM_STATIC_COLLECTION_DATE: ${{ inputs.collection_date || '' }}
        run: |
          set -euo pipefail
          [[ -n "${SOPS_AGE_KEY}" ]] || {
            echo "::error::Add the SOPS_AGE_KEY Actions secret containing the age private key for this project's encrypted environment."
            exit 1
          }

          pm-setup

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_SITE_DIR }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs:
      - setup

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
