name: ReviewNudge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out ReviewNudge
        uses: actions/checkout@v4

      - name: Check out Portmason tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PORTMASON_REPOSITORY || 'domer6811/ops-and-sops' }}
          token: ${{ secrets.OPS_AND_SOPS_TOKEN || github.token }}
          path: ops-and-sops

      - name: Run the governed setup workflow
        env:
          CI: 'true'
          PORTMASON_SHARE: ${{ github.workspace }}/ops-and-sops/ops/portmason
          PATH: ${{ github.workspace }}/ops-and-sops/ops/portmason:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: pm-setup
